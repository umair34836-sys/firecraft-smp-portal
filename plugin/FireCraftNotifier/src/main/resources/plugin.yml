name: FireCraftNotifier
version: 1.5.0
main: com.firecraft.notifier.FireCraftNotifier
api-version: '1.21'
description: Server reporting, player alerts, and website sync for FireCraft SMP.
author: FireCraft

commands:
  fcn:
    description: FireCraftNotifier admin commands.
    usage: /fcn <help|info|reload|fetch|poll|status|list|remind|announce|whitelist>
    permission: firecraftnotifier.admin
    aliases: [firecraftnotifier]
  report:
    description: Report an issue to server staff.
    usage: /report <message>
    permission: firecraft.report
  vote:
    description: Opens the voting GUI with links to vote for FireCraft SMP.
    usage: /vote
    permission: firecraft.vote

permissions:
  firecraftnotifier.admin:
    description: Access to all FireCraftNotifier admin commands.
    default: op
  firecraft.report:
    description: Allows players to submit reports to staff via /report.
    default: true
  firecraft.vote:
    description: Allows players to use the /vote command.
    default: true
